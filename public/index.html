<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Vero MVP</title>
  <script type="module">
    import { OisyAuth } from 'https://unpkg.com/oisy-sdk@latest/dist/oisy-sdk.min.js';

    const oisy = new OisyAuth({
      clientId: 'test-client-id', // ← replace with real clientId later
      redirectUri: window.location.href,
    });

    window.onload = () => {
      document.getElementById("login").onclick = () => oisy.signIn();
    };
  </script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      background-color: #22c55e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    h1 {
      color: #1e293b;
    }
  </style>
</head>
<body>
  <h1>✅ Check Vero Demo</h1>
  <p>Connect your Oisy Wallet to proceed.</p>
  <button id="login">Login with Oisy Wallet</button>
</body>
</html>
